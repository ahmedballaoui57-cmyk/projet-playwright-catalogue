name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même commande qu'en local : construit l'image, démarre un PostgreSQL jetable, lance pytest.
      - name: Lancer les tests dans Docker
        run: docker compose --profile tests run --rm tests

      - name: Construire l'image de production
        run: docker compose build api
